name: Deploy workflows to n8n

on:
  push:
    branches: [main]
    paths:
      - "workflows/**"
      - "manifest.json"
      - "scripts/deploy-workflows.mjs"
      - ".github/workflows/deploy-n8n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate workflow JSON
        shell: bash
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('manifest.json')); for(const f of fs.readdirSync('workflows').filter(x=>x.endsWith('.json'))) JSON.parse(fs.readFileSync('workflows/'+f));"

      - name: Deploy workflows
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node scripts/deploy-workflows.mjs
