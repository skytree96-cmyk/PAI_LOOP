services:
  - type: web
    name: pai-loop-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PAI_LOOP_ENV
        value: production
      - key: PAI_LOOP_DATABASE_URL
        fromDatabase:
          name: pai-loop-demo-db
          property: connectionString
      - key: PAI_LOOP_API_KEY
        generateValue: true
      - key: PAI_LOOP_PUBLIC_READ_ONLY
        value: "true"
      - key: PAI_LOOP_PUBLIC_MANUAL_ANALYSIS_ENABLED
        value: "true"
      - key: PAI_LOOP_PUBLIC_MANUAL_ANALYSIS_TOKEN
        sync: false
      - key: PAI_LOOP_PUBLIC_MANUAL_ANALYSIS_HOURLY_LIMIT
        value: "0"
      - key: PAI_LOOP_PUBLIC_MANUAL_ANALYSIS_COOLDOWN_HOURS
        value: "24"
      - key: PAI_LOOP_SEED_SYNTHETIC
        value: "false"
      - key: PAI_LOOP_LLM_PROVIDER
        value: n8n_claude
      - key: PAI_LOOP_LLM_GATEWAY_BASE_URL
        value: https://n8n.kma.or.kr/webhook/pai-loop-claude
      - key: PAI_LOOP_CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: PPS_API_KEY
        sync: false

databases:
  - name: pai-loop-demo-db
    plan: free
    region: singapore
    ipAllowList: []
