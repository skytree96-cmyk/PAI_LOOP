[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pai-loop"
version = "0.8.1"
description = "Evidence-first public procurement decision support API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
pai-loop = "pai_loop.main:run"
pai-loop-seed-public-notice = "pai_loop.public_notice_cli:main"
pai-loop-migrate = "pai_loop.migrations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_loop"]
exclude = [
  "src/pai_loop/private_import.py",
  "src/pai_loop/private_fact_matching.py",
]

[tool.hatch.build.targets.wheel.force-include]
"src/pai_loop/data/rules_v2_1.json" = "pai_loop/data/rules_v2_1.json"
"src/pai_loop/data/company_public_profile.json" = "pai_loop/data/company_public_profile.json"
"src/pai_loop/data/public_performance_seed_v1.json" = "pai_loop/data/public_performance_seed_v1.json"
"src/pai_loop/data/public_notice_seed_v1.json" = "pai_loop/data/public_notice_seed_v1.json"
"src/pai_loop/data/public_award_history_seed_v1.json" = "pai_loop/data/public_award_history_seed_v1.json"
"src/pai_loop/data/pricing_method_profiles_v1.json" = "pai_loop/data/pricing_method_profiles_v1.json"
"src/pai_loop/data/department_keyword_profiles.json" = "pai_loop/data/department_keyword_profiles.json"
"src/pai_loop/data/quantitative_notice_profiles.json" = "pai_loop/data/quantitative_notice_profiles.json"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pai_loop"]
omit = [
  "src/pai_loop/private_import.py",
  "src/pai_loop/private_fact_matching.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
