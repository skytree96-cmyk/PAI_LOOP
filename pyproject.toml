[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pai-loop"
version = "0.1.0"
description = "Evidence-first public procurement decision support API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
pai-loop = "pai_loop.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_loop"]

[tool.hatch.build.targets.wheel.force-include]
"src/pai_loop/data/rules_v2_1.json" = "pai_loop/data/rules_v2_1.json"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pai_loop"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
