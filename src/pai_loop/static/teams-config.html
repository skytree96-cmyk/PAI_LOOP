<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PAI LOOP Teams 탭 설정</title>
    <style>
      :root { color-scheme: light dark; font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #18312e; background: #f4f7f5; }
      main { width: min(520px, calc(100vw - 32px)); padding: 28px; border: 1px solid #dce5e1; border-radius: 18px; background: #fff; box-shadow: 0 16px 45px rgb(15 41 39 / 0.12); }
      .mark { display: grid; width: 48px; height: 48px; margin-bottom: 18px; place-items: center; border-radius: 14px; color: #83d9c8; background: #0e2b2a; font-size: 21px; font-weight: 900; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -0.03em; }
      p { margin: 9px 0 0; color: #63736f; font-size: 14px; line-height: 1.7; }
      .status { display: flex; align-items: center; gap: 9px; margin-top: 22px; padding: 13px 14px; border-radius: 10px; color: #176354; background: #edf8f3; font-size: 13px; font-weight: 750; }
      .status::before { width: 8px; height: 8px; border-radius: 50%; background: currentcolor; content: ""; }
      .status.is-error { color: #a63f35; background: #fff0ed; }
      body[data-theme="dark"] { color: #f1f7f5; background: #172220; }
      body[data-theme="dark"] main { border-color: #354642; background: #20302d; }
      body[data-theme="dark"] p { color: #b4c2be; }
    </style>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">PAI</div>
      <h1>PAI LOOP 탭 추가</h1>
      <p>현재 채널 또는 그룹 채팅 안에서 입찰 기회, 분석 근거와 추천 결과를 확인합니다. 별도 브라우저로 자동 이동하지 않습니다.</p>
      <div class="status" id="status" role="status" aria-live="polite">Teams 연결을 확인하고 있습니다.</div>
    </main>
    <script>
      (() => {
        "use strict";
        const status = document.getElementById("status");
        const fail = (message) => {
          status.textContent = message;
          status.classList.add("is-error");
        };
        const safeEntityId = (context) => {
          const raw = context?.channel?.id || context?.chat?.id || context?.team?.internalId || "pai-loop";
          const safe = String(raw).replace(/[^A-Za-z0-9_-]/g, "").slice(-48);
          return `pai-loop-${safe || "opportunities"}`.slice(0, 64);
        };

        async function configure() {
          const teams = window.microsoftTeams;
          if (!teams?.app?.initialize || !teams?.pages?.config) {
            fail("Teams SDK를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
            return;
          }
          try {
            await teams.app.initialize();
            const context = await teams.app.getContext();
            const theme = String(context?.app?.theme || "").toLowerCase();
            if (["dark", "contrast"].includes(theme)) document.body.dataset.theme = "dark";
            const root = window.location.origin;
            teams.pages.config.registerOnSaveHandler(async (saveEvent) => {
              try {
                await teams.pages.config.setConfig({
                  contentUrl: `${root}/?host=teams`,
                  websiteUrl: `${root}/`,
                  entityId: safeEntityId(context),
                  suggestedDisplayName: "PAI LOOP",
                });
                saveEvent.notifySuccess();
              } catch (_error) {
                saveEvent.notifyFailure("PAI LOOP 탭 주소를 저장하지 못했습니다.");
              }
            });
            teams.pages.config.setValidityState(true);
            status.textContent = "준비되었습니다. Teams의 저장 버튼을 눌러 탭을 추가하세요.";
          } catch (_error) {
            fail("이 설정 화면은 Teams 채널 또는 그룹 채팅의 탭 추가 메뉴에서 열어 주세요.");
          }
        }

        void configure();
      })();
    </script>
  </body>
</html>
